<section class="card" aria-labelledby="whiteboard-card-title">
    <header class="card-head"><h3 id="whiteboard-card-title" class="card-title">
        <button type="button" class="card-toggle" @click="toggleCard('whiteboard')" :aria-expanded="openCard === 'whiteboard'" aria-controls="whiteboard-card-body">
            <img class="app-icon" src="../assets/icons/brush.svg" alt="" aria-hidden="true"><span>Whiteboard</span>
            <span class="card-head-right"><span class="chip chip-gold" x-show="whiteboardActive">Live</span><span class="accordion-arrow" :class="{ open: openCard === 'whiteboard' }" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span></span>
        </button>
    </h3></header>
    <div id="whiteboard-card-body" class="card-body" x-show="openCard === 'whiteboard'" x-transition.opacity>
        <button type="button" class="btn" :class="whiteboardActive ? 'btn-primary' : 'btn-ghost'" :aria-pressed="whiteboardActive" @click="setWhiteboardActive(!whiteboardActive)" x-text="whiteboardActive ? 'Hide whiteboard' : 'Show whiteboard'"></button>
        <div class="whiteboard-tools" x-show="whiteboardActive">
            <div>
                <div class="field-label">Draw tool</div>
                <div class="whiteboard-tool-grid" role="group" aria-label="Whiteboard drawing tools">
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'pencil'" @click="setWhiteboardTool('pencil')">Pencil</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'highlighter'" @click="setWhiteboardTool('highlighter')">Highlighter</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'line'" @click="setWhiteboardTool('line')">Line</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'arrow'" @click="setWhiteboardTool('arrow')">Arrow</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'rectangle'" @click="setWhiteboardTool('rectangle')">Rectangle</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'ellipse'" @click="setWhiteboardTool('ellipse')">Ellipse</button>
                    <button class="whiteboard-tool" type="button" :aria-pressed="whiteboardTool === 'eraser'" @click="setWhiteboardTool('eraser')">Eraser</button>
                </div>
            </div>
            <div>
                <label class="field-label" for="whiteboard-colour">Line colour</label>
                <div class="whiteboard-colour-input">
                    <input id="whiteboard-colour" type="color" :value="whiteboardColor" @input="setWhiteboardColor($event.target.value)">
                    <span class="grid-size-readout" x-text="whiteboardColor"></span>
                </div>
                <div class="whiteboard-colour-swatches" role="group" aria-label="Quick line colours">
                    <button class="whiteboard-swatch" type="button" style="background:#1e293b" aria-label="Ink" :aria-pressed="whiteboardColor === '#1e293b'" @click="setWhiteboardColor('#1e293b')"></button>
                    <button class="whiteboard-swatch" type="button" style="background:#ef4444" aria-label="Red" :aria-pressed="whiteboardColor === '#ef4444'" @click="setWhiteboardColor('#ef4444')"></button>
                    <button class="whiteboard-swatch" type="button" style="background:#f59e0b" aria-label="Amber" :aria-pressed="whiteboardColor === '#f59e0b'" @click="setWhiteboardColor('#f59e0b')"></button>
                    <button class="whiteboard-swatch" type="button" style="background:#eab308" aria-label="Yellow" :aria-pressed="whiteboardColor === '#eab308'" @click="setWhiteboardColor('#eab308')"></button>
                    <button class="whiteboard-swatch" type="button" style="background:#22c55e" aria-label="Green" :aria-pressed="whiteboardColor === '#22c55e'" @click="setWhiteboardColor('#22c55e')"></button>
                    <button class="whiteboard-swatch" type="button" style="background:#3b82f6" aria-label="Blue" :aria-pressed="whiteboardColor === '#3b82f6'" @click="setWhiteboardColor('#3b82f6')"></button>
                </div>
            </div>
            <div>
                <label class="field-label grid-size-label" for="whiteboard-size"><span>Stroke size</span><span class="grid-size-readout" x-text="whiteboardSize + ' px'"></span></label>
                <input id="whiteboard-size" type="range" min="2" max="48" step="1" class="grid-slider" x-model.number="whiteboardSize">
            </div>
            <div class="whiteboard-actions">
                <button type="button" class="btn btn-ghost btn-sm" :disabled="whiteboardStrokes.length === 0" @click="undoWhiteboard()">Undo last</button>
                <button type="button" class="btn btn-ghost btn-sm" @click="clearWhiteboard()">Clear board</button>
            </div>
        </div>
    </div>
</section>
